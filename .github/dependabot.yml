version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns:
          - wrangler
          - miniflare
          - '@cloudflare/*'
      svelte:
        patterns:
          - svelte
          - svelte-check
          - '@sveltejs/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
